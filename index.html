<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaX™ — Building the Parallel Economy™</title>
<meta name="description" content="NovaX™ — Building the Parallel Economy™. What would you do with $50K? Take the quiz to see if you qualify for NovaX™.">
<meta name="theme-color" content="#030a16">
<style>
:root{--page-bg:#030a16;--footer:#03070d;--footer-text:#8b96a8;--footer-link:#b9c6d8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page-bg);color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100svh;overflow-x:hidden}
.landing-page{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:var(--page-bg);overflow-x:hidden}
.landing-stage{position:relative;flex:0 0 auto;width:100vw;height:100svh;min-height:0;overflow:hidden;background:var(--page-bg);display:flex;align-items:center;justify-content:center}
.landing-art{display:block;width:auto;height:100%;max-width:none;object-fit:contain;flex:0 0 auto}
.landing-art--landscape{display:none}
.landing-tagline{position:absolute;z-index:2;top:10.55%;left:0;width:100%;text-align:center;color:#f1f6ff;font-size:clamp(8px,1.05vw,17px);font-weight:500;letter-spacing:.32em;line-height:1.2;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.35);pointer-events:none}
.landing-cta{position:absolute;left:25.6%;top:48.0%;width:48.5%;height:6.0%;z-index:3;display:block;border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.landing-cta:focus-visible{outline:3px solid #fff;outline-offset:6px}
.site-footer{width:100%;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 12px 16px;background:var(--footer);color:var(--footer-text);font-size:10px;line-height:1.4;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.site-footer a{color:var(--footer-link);text-decoration:none}.site-footer a:hover{color:#fff}.site-footer a:focus-visible{outline:2px solid #fff;outline-offset:3px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
@media (min-width:768px) and (orientation:landscape){
 .landing-stage{width:100vw;height:min(100svh,56.32775vw);max-height:100svh}
 .landing-art--portrait{display:none}
 .landing-art--landscape{display:block;width:100%;height:100%;object-fit:fill}
 .landing-tagline{top:10.3%;font-size:clamp(10px,1.05vw,18px);letter-spacing:.32em}
 .landing-cta{left:38.0%;top:46.0%;width:24.0%;height:8.0%}
}
@media (max-width:767px),(orientation:portrait){
 .landing-art--portrait{display:block}
 .landing-art--landscape{display:none}
 .landing-tagline{top:10.55%;font-size:clamp(8px,1.05vw,13px);letter-spacing:.25em}
 .landing-cta{left:25.6%;top:48.0%;width:48.5%;height:6.0%}
}
@media (max-width:767px),(orientation:portrait){
 .landing-art{animation-duration:4.6s;will-change:opacity,transform,filter}
 .landing-stage::before{width:clamp(190px,66vw,420px);height:clamp(66px,23vw,145px);top:50%}
 .landing-stage::after{width:32%;filter:blur(7px)}
}
@media (prefers-reduced-motion:reduce){.landing-cta{transition:none}}

/* v57.2 cinematic entrance: layered energy reveal, CSS-only and reduced-motion aware. */
@keyframes novaxLandingCinematic{
  /* Concept 2-inspired staged assembly: components settle, energy locks, then the mark resolves. */
  0%{opacity:.18;transform:scale(1.09) translate3d(0,1.6%,0) rotate(-.35deg);filter:brightness(.38) saturate(.68) contrast(1.08)}
  12%{opacity:.55;transform:scale(1.065) translate3d(0,.9%,0) rotate(.18deg);filter:brightness(.68) saturate(.9)}
  24%{opacity:.86;transform:scale(1.035) translate3d(0,-.25%,0) rotate(-.08deg);filter:brightness(1.22) saturate(1.15)}
  31%{transform:scale(1.018) translate3d(0,.12%,0) rotate(0);filter:brightness(1.62) saturate(1.22) contrast(1.03)}
  39%{transform:scale(1.024) translate3d(0,0,0);filter:brightness(.94) saturate(1.08)}
  56%{opacity:1;transform:scale(1.012);filter:brightness(1.07) saturate(1.1)}
  76%{transform:scale(1.004);filter:brightness(1.015)}
  100%{opacity:1;transform:scale(1);filter:brightness(1) saturate(1)}
}
@keyframes novaxEnergyRing{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.36) rotate(-12deg)}
  18%{opacity:.95;transform:translate(-50%,-50%) scale(.72) rotate(4deg)}
  38%{opacity:.82;transform:translate(-50%,-50%) scale(1.18) rotate(0)}
  58%{opacity:.24;transform:translate(-50%,-50%) scale(1.55) rotate(8deg)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.8) rotate(8deg)}
}
@keyframes novaxEnergySweep{
  0%,13%{opacity:0;transform:translateX(-120%) skewX(-16deg)}
  22%{opacity:.8}
  34%{opacity:.3;transform:translateX(125%) skewX(-16deg)}
  42%,100%{opacity:0;transform:translateX(125%) skewX(-16deg)}
}
.landing-art{transform-origin:center center;animation:novaxLandingCinematic 4.6s cubic-bezier(.18,.68,.16,1) both;will-change:opacity,transform,filter}
.landing-stage::before{content:"";position:absolute;z-index:1;left:50%;top:51%;width:clamp(220px,37vw,680px);height:clamp(74px,12vw,210px);border-radius:50%;border:2px solid rgba(32,216,255,.45);background:transparent;box-shadow:0 0 18px rgba(32,216,255,.18),inset 0 0 24px rgba(147,71,255,.12);pointer-events:none;animation:novaxEnergyRing 4.6s cubic-bezier(.18,.68,.16,1) both}
.landing-stage::after{content:"";position:absolute;z-index:2;top:-20%;bottom:-20%;left:-35%;width:24%;background:linear-gradient(90deg,transparent,rgba(99,218,255,.12),rgba(255,255,255,.5),rgba(166,105,255,.18),transparent);filter:blur(9px);mix-blend-mode:screen;pointer-events:none;animation:novaxEnergySweep 4.6s ease-out both}
.landing-cta{transition:box-shadow .22s ease,filter .22s ease,background-color .22s ease}
.landing-cta:hover,.landing-cta:focus-visible{box-shadow:0 0 18px rgba(32,216,255,.36),0 0 36px rgba(125,76,255,.24);background:rgba(32,216,255,.035)}
.landing-cta:active{filter:brightness(1.12)}
@media(prefers-reduced-motion:reduce){.landing-art{animation:none!important;transform:none!important;filter:none!important}.landing-stage::before,.landing-stage::after{animation:none!important;display:none!important}.landing-cta{transition:none!important}}


/* v58 Concept 2: Mechanical Assembly — separate layered CSS motion over the preserved homepage art. */
.landing-stage{isolation:isolate}
.landing-art{position:relative;z-index:0}
.assembly-sequence{position:absolute;z-index:1;left:50%;top:50%;width:min(78vw,960px);height:min(34vw,390px);min-height:160px;transform:translate(-50%,-50%);pointer-events:none;overflow:visible;mix-blend-mode:screen}
.assembly-orbit{position:absolute;left:50%;top:50%;width:66%;height:52%;border:2px solid rgba(56,221,255,.0);border-radius:50%;box-shadow:0 0 18px rgba(35,213,255,0);transform:translate(-50%,-50%);animation:assemblyOrbit 4.8s cubic-bezier(.18,.7,.2,1) both}
.orbit-a{border-top-color:rgba(58,226,255,.95);border-bottom-color:rgba(150,91,255,.7)}
.orbit-b{width:54%;height:80%;border-left-color:rgba(75,208,255,.85);border-right-color:rgba(170,92,255,.8);animation-name:assemblyOrbitB}
.assembly-part{position:absolute;left:50%;top:50%;display:block;width:clamp(28px,5vw,72px);height:clamp(28px,5vw,72px);border:1px solid rgba(131,232,255,.95);background:linear-gradient(135deg,rgba(32,214,255,.3),rgba(107,65,255,.13));box-shadow:0 0 16px rgba(41,207,255,.36),inset 0 0 12px rgba(255,255,255,.18);opacity:0;clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%);}
.part-top{--dx:0;--dy:-1;animation:assembleTop 4.8s cubic-bezier(.16,.78,.2,1) both}
.part-bottom{--dx:0;--dy:1;animation:assembleBottom 4.8s cubic-bezier(.16,.78,.2,1) both}
.part-left{--dx:-1;--dy:0;animation:assembleLeft 4.8s cubic-bezier(.16,.78,.2,1) both}
.part-right{--dx:1;--dy:0;animation:assembleRight 4.8s cubic-bezier(.16,.78,.2,1) both}
.assembly-core{position:absolute;left:50%;top:50%;width:clamp(16px,2.2vw,34px);height:clamp(16px,2.2vw,34px);border-radius:50%;background:radial-gradient(circle,#fff 0 10%,#a9f4ff 22%,#2bdcff 42%,rgba(115,75,255,.2) 70%,transparent 72%);box-shadow:0 0 14px #4ce7ff,0 0 42px rgba(94,104,255,.9);opacity:0;transform:translate(-50%,-50%) scale(.1);animation:coreIgnition 4.8s ease-out both}
.assembly-flash{position:absolute;left:50%;top:50%;width:6%;height:2px;background:#fff;box-shadow:0 0 22px 8px rgba(96,225,255,.8);opacity:0;transform:translate(-50%,-50%) scaleX(.1);animation:assemblyFlash 4.8s ease-out both}
@keyframes assemblyOrbit{0%,10%{opacity:0;transform:translate(-50%,-50%) rotate(-25deg) scale(.35)}22%{opacity:.95}42%{opacity:.8;transform:translate(-50%,-50%) rotate(8deg) scale(1.04)}66%{opacity:.25;transform:translate(-50%,-50%) rotate(0) scale(1.22)}100%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(1.4)}}
@keyframes assemblyOrbitB{0%,12%{opacity:0;transform:translate(-50%,-50%) rotate(35deg) scale(.4)}26%{opacity:.85}46%{opacity:.7;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}68%{opacity:.18;transform:translate(-50%,-50%) rotate(0) scale(1.18)}100%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(1.35)}}
@keyframes assembleTop{0%,9%{opacity:0;transform:translate(-50%,-50%) translateY(-145px) rotate(45deg)}23%{opacity:1}42%{opacity:.9;transform:translate(-50%,-50%) translateY(-24px) rotate(12deg)}51%{opacity:.75;transform:translate(-50%,-50%) translateY(-9px) rotate(0)}70%,100%{opacity:0;transform:translate(-50%,-50%) translateY(-9px) rotate(0)}}
@keyframes assembleBottom{0%,9%{opacity:0;transform:translate(-50%,-50%) translateY(145px) rotate(-45deg)}23%{opacity:1}42%{opacity:.9;transform:translate(-50%,-50%) translateY(24px) rotate(-12deg)}51%{opacity:.75;transform:translate(-50%,-50%) translateY(9px) rotate(0)}70%,100%{opacity:0;transform:translate(-50%,-50%) translateY(9px) rotate(0)}}
@keyframes assembleLeft{0%,9%{opacity:0;transform:translate(-50%,-50%) translateX(-220px) rotate(-45deg)}23%{opacity:1}42%{opacity:.9;transform:translate(-50%,-50%) translateX(-42px) rotate(-12deg)}51%{opacity:.75;transform:translate(-50%,-50%) translateX(-12px) rotate(0)}70%,100%{opacity:0;transform:translate(-50%,-50%) translateX(-12px) rotate(0)}}
@keyframes assembleRight{0%,9%{opacity:0;transform:translate(-50%,-50%) translateX(220px) rotate(45deg)}23%{opacity:1}42%{opacity:.9;transform:translate(-50%,-50%) translateX(42px) rotate(12deg)}51%{opacity:.75;transform:translate(-50%,-50%) translateX(12px) rotate(0)}70%,100%{opacity:0;transform:translate(-50%,-50%) translateX(12px) rotate(0)}}
@keyframes coreIgnition{0%,38%{opacity:0;transform:translate(-50%,-50%) scale(.1)}48%{opacity:1;transform:translate(-50%,-50%) scale(1.5)}55%{opacity:.95;transform:translate(-50%,-50%) scale(.9)}68%,100%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}
@keyframes assemblyFlash{0%,45%{opacity:0;transform:translate(-50%,-50%) scaleX(.1)}49%{opacity:.95;transform:translate(-50%,-50%) scaleX(12)}57%{opacity:0;transform:translate(-50%,-50%) scaleX(18)}100%{opacity:0}}
@media(max-width:767px),(orientation:portrait){.assembly-sequence{width:94vw;height:44vw;min-height:140px}.assembly-part{width:clamp(24px,7vw,46px);height:clamp(24px,7vw,46px)}@keyframes assembleTop{0%,9%{opacity:0;transform:translate(-50%,-50%) translateY(-82px) rotate(45deg)}23%{opacity:1}42%{opacity:.9;transform:translate(-50%,-50%) translateY(-18px) rotate(12deg)}51%{opacity:.75;transform:translate(-50%,-50%) translateY(-7px) rotate(0)}70%,100%{opacity:0;transform:translate(-50%,-50%) translateY(-7px) rotate(0)}}@keyframes assembleBottom{0%,9%{opacity:0;transform:translate(-50%,-50%) translateY(82px) rotate(-45deg)}23%{opacity:1}42%{opacity:.9;transform:translate(-50%,-50%) translateY(18px) rotate(-12deg)}51%{opacity:.75;transform:translate(-50%,-50%) translateY(7px) rotate(0)}70%,100%{opacity:0;transform:translate(-50%,-50%) translateY(7px) rotate(0)}}@keyframes assembleLeft{0%,9%{opacity:0;transform:translate(-50%,-50%) translateX(-110px) rotate(-45deg)}23%{opacity:1}42%{opacity:.9;transform:translate(-50%,-50%) translateX(-30px) rotate(-12deg)}51%{opacity:.75;transform:translate(-50%,-50%) translateX(-9px) rotate(0)}70%,100%{opacity:0;transform:translate(-50%,-50%) translateX(-9px) rotate(0)}}@keyframes assembleRight{0%,9%{opacity:0;transform:translate(-50%,-50%) translateX(110px) rotate(45deg)}23%{opacity:1}42%{opacity:.9;transform:translate(-50%,-50%) translateX(30px) rotate(12deg)}51%{opacity:.75;transform:translate(-50%,-50%) translateX(9px) rotate(0)}70%,100%{opacity:0;transform:translate(-50%,-50%) translateX(9px) rotate(0)}}}
@media(prefers-reduced-motion:reduce){.assembly-sequence{display:none!important}}


/* Stage 2: Concept 2 intro + X-to-homepage transition (video overlay). The last video frame is the real homepage art,
   sized exactly like .landing-art, so removing the overlay causes no visible jump. */
.novax-intro{position:fixed;inset:0;overflow:hidden;z-index:9999;display:flex;align-items:center;justify-content:center;background:#030a16;opacity:1;visibility:visible;transition:opacity .45s ease,visibility .45s ease}
.novax-intro.is-done{opacity:0;visibility:hidden;pointer-events:none}
.novax-intro__video{display:block;background:#030a16;flex:0 0 auto;height:100svh;width:calc(100svh * 2 / 3);max-width:none}
@media (min-width:768px) and (orientation:landscape){.novax-intro__video{width:100vw;height:min(100svh,56.32775vw);max-height:100svh;object-fit:fill}}
.novax-intro__skip{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));padding:10px 14px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(3,10,22,.72);color:#fff;font:600 11px/1 Arial,sans-serif;letter-spacing:.12em;cursor:pointer}
.novax-intro__skip:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.novax-intro{display:none!important}}
</style>
</head>
<body>
<div class="novax-intro" id="novaxIntro" role="presentation" aria-label="NovaX introduction">
  <video id="novaxIntroVideo" class="novax-intro__video" muted playsinline preload="auto" aria-hidden="true"></video>
  <button class="novax-intro__skip" id="novaxIntroSkip" type="button" aria-label="Skip introduction">SKIP INTRO</button>
</div>
<main class="landing-page" aria-label="NovaX™ landing page">
  <section class="landing-stage" aria-label="NovaX™ introduction">
    <img class="landing-art landing-art--portrait" src="assets/NovaX_LOCKED_PORTRAIT_REFERENCE.png" alt="NovaX™ — Building the Parallel Economy™. What would you do with $50K?">
    <img class="landing-art landing-art--landscape" src="assets/NovaX_LOCKED_LANDSCAPE_REFERENCE.png" alt="" aria-hidden="true">

    <div class="landing-tagline" aria-label="Building the Parallel Economy">BUILDING THE PARALLEL ECONOMY™</div>
    <a class="landing-cta" href="quiz.html" aria-label="Let's begin the NovaX™ quiz"><span class="sr-only">LET’S BEGIN →</span></a>
  </section>
  <nav class="site-footer" aria-label="Site navigation">
    <span>Copyright © 2026 NovaX™</span><span aria-hidden="true">•</span>
    <a href="index.html">Home</a><span aria-hidden="true">•</span>
    <a href="quiz.html">Quiz</a><span aria-hidden="true">•</span>
    <a href="privacy.html">Privacy</a><span aria-hidden="true">•</span>
    <a href="terms.html">Terms</a>
  </nav>
</main>
<script>
(function(){
  var overlay=document.getElementById('novaxIntro');
  var video=document.getElementById('novaxIntroVideo');
  var skip=document.getElementById('novaxIntroSkip');
  if(!overlay||!video)return;
  var finished=false,started=false,timers=[];
  function finish(){
    if(finished)return;finished=true;
    clearTimeout(startT);timers.forEach(clearTimeout);
    overlay.classList.add('is-done');               // fades out over the identical homepage frame
    try{sessionStorage.setItem('novax_intro_seen','1');}catch(e){}
    setTimeout(function(){try{video.pause();}catch(e){}overlay.remove();},600);
  }
  var mq=function(q){return window.matchMedia&&window.matchMedia(q).matches;};
  var reduced=mq('(prefers-reduced-motion: reduce)');
  var seen=false;try{seen=sessionStorage.getItem('novax_intro_seen')==='1';}catch(e){}
  var force=/[?&]intro=1(&|$)/.test(location.search);   // ?intro=1 replays the intro
  if(reduced||(seen&&!force)){finish();return;}
  // Same breakpoint the page CSS uses to choose the portrait vs landscape homepage art.
  var portrait=mq('(max-width:767px),(orientation:portrait)');
  // Autoplay needs the video to be muted as a property (not only an attribute) on some Android/Samsung browsers.
  video.muted=true;video.defaultMuted=true;video.volume=0;
  video.setAttribute('muted','');video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.preload='auto';
  video.addEventListener('ended',finish,{once:true});
  video.addEventListener('error',finish,{once:true});
  // Never hold the homepage hostage. Slow networks get time as long as data keeps arriving; once playing, a hard cap applies.
  var startT;function armStart(ms){clearTimeout(startT);startT=setTimeout(function(){if(!started)finish();},ms);}
  video.addEventListener('playing',function(){
    if(started)return;started=true;clearTimeout(startT);
    timers.push(setTimeout(finish,((video.duration&&isFinite(video.duration))?video.duration:9)*1000+5000));
  },{once:true});
  ['progress','loadeddata','canplay','canplaythrough'].forEach(function(ev){video.addEventListener(ev,function(){if(!started)armStart(8000);});});
  armStart(8000);
  if(skip)skip.addEventListener('click',finish);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')finish();});
  // MP4 (H.264) first; WebM (VP9) only for browsers without H.264 (e.g. some Chromium/Linux builds).
  var base='assets/novax-intro-transition-'+(portrait?'portrait':'1080p');
  var ext=(video.canPlayType('video/mp4; codecs="avc1.640028"')||video.canPlayType('video/mp4; codecs="avc1.4D4028"'))?'.mp4':(video.canPlayType('video/webm; codecs="vp9"')?'.webm':'');
  if(!ext){finish();return;}
  video.src=base+ext;
  var p=video.play();if(p&&typeof p.catch==='function')p.catch(finish);
})();
</script>
